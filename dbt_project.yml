name: 'ap_analytics'
version: '1.0.0'
config-version: 2

# Project profile configuration
profile: 'ap_analytics'

# Model path configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  ap_analytics:
    # Staging models - Silver Layer (Views in SLV_DATA schema)
    staging:
      +materialized: view
      +schema: slv_data
      +tags: ["staging", "silver"]
      
    # Mart models - Gold Layer (Tables in GLD_DATA schema)
    marts:
      +materialized: table
      +schema: gld_data
      +tags: ["marts", "gold"]

# Global variables
vars:
  # Client/Company defaults
  default_client: '100'
  default_company_code: 'C001'
  
  # Date range for incremental loads (can be overridden)
  start_date: '2024-01-01'
  end_date: '2024-12-31'

# Seeds configuration
seeds:
  ap_analytics:
    +schema: slv_data
    +quote_columns: false